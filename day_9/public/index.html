<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Day 9</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: white;
            text-align: center;
        }

        h2 {
            display: inline-block;
            background-color: black;
            color: white;
            padding: 8px 15px;
            margin-top: 30px;
        }

        /* Common Box */
        .box {
            width: 270px;
            height: 270px;
            margin: 10px auto;
            border-radius: 10px;
            box-shadow: 0 0 15px gold;
            overflow: hidden;
        }

        .box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        button {
            background-color: orange;
            border: none;
            padding: 8px 15px;
            margin: 5px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: darkorange;
        }

        /* Counter */
        #count {
            font-size: 50px;
            font-weight: bold;
            margin: 15px;
        }

        .section {
            margin-bottom: 45px;
        }

    </style>
</head>

<body>




<div class="section">

    <h2>→ Image Rotation</h2>

    <div class="box">
        <img id="rotatingImage"
             src="https://picsum.photos/id/1015/500/500"
             alt="Rotating Image">
    </div>

    <button onclick="rotateLeft()">
        ← Rotate Left
    </button>

    <button onclick="rotateRight()">
        Rotate Right →
    </button>

</div>




<div class="section">

    <h2>→ Image Slider</h2>

    <div class="box">

        <img id="sliderImage"
             src="https://picsum.photos/id/1015/500/500"
             alt="Slider Image">

    </div>

    <button onclick="previousImage()">
        ← Previous
    </button>

    <button onclick="nextImage()">
        Next →
    </button>

    <p id="slideNumber">Image 1 of 4</p>

</div>


<!-- ================= COUNTER ================= -->

<div class="section">

    <h2>→ Counter</h2>

    <div id="count">
        0
    </div>

    <button onclick="decrease()">
        −
    </button>

    <button onclick="resetCounter()">
        Reset
    </button>

    <button onclick="increase()">
        +
    </button>

</div>


<script>

    /* =====================================
       IMAGE ROTATION
       ===================================== */

    let rotation = 0;

    function rotateLeft() {

        rotation -= 90;

        document.getElementById("rotatingImage").style.transform =
            "rotate(" + rotation + "deg)";
    }

    function rotateRight() {

        rotation += 90;

        document.getElementById("rotatingImage").style.transform =
            "rotate(" + rotation + "deg)";
    }


    /* =====================================
       IMAGE SLIDER
       ===================================== */

    const images = [
        "https://picsum.photos/id/1015/500/500",
        "https://picsum.photos/id/1016/500/500",
        "https://picsum.photos/id/1018/500/500",
        "https://picsum.photos/id/1020/500/500"
    ];

    let currentImage = 0;

    function showImage() {

        document.getElementById("sliderImage").src =
            images[currentImage];

        document.getElementById("slideNumber").innerText =
            "Image " + (currentImage + 1) + " of " + images.length;
    }

    function nextImage() {

        currentImage++;

        if (currentImage >= images.length) {
            currentImage = 0;
        }

        showImage();
    }

    function previousImage() {

        currentImage--;

        if (currentImage < 0) {
            currentImage = images.length - 1;
        }

        showImage();
    }


    /* =====================================
       COUNTER
       ===================================== */

    let count = 0;

    function increase() {

        count++;

        document.getElementById("count").innerText = count;
    }

    function decrease() {

        count--;

        document.getElementById("count").innerText = count;
    }

    function resetCounter() {

        count = 0;

        document.getElementById("count").innerText = count;
    }

</script>

</body>
</html>
